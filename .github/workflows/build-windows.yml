name: Build Sofia for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Sofia
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run build:win

      - name: Build and publish Windows installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win:publish

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-Windows-Installer
          path: |
            dist/**/*.exe
            dist/**/*.yml
            dist/**/*.blockmap
          if-no-files-found: error

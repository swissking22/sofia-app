name: Build Sofia for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Sofia
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sign when WINDOWS_CSC_* secrets exist. Tag builds and workflow_dispatch
      # both succeed unsigned if secrets are missing (SmartScreen will warn).
      - name: Check Windows signing certificate
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.WINDOWS_CSC_LINK }}" ] && [ -n "${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Windows installer will be Authenticode-signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WINDOWS_CSC_LINK / WINDOWS_CSC_KEY_PASSWORD not set — building unsigned. Add those repo secrets for signed releases."
          fi

      - name: Build Windows installer (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed == 'true' && 'true' || 'false' }}
        run: npm run build:win

      - name: Build and publish Windows installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed == 'true' && 'true' || 'false' }}
        run: npm run build:win:publish

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-Windows-Installer
          path: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.yml
            dist/**/*.blockmap
          retention-days: 3
          if-no-files-found: error

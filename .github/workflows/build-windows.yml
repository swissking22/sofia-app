name: Build Sofia for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Sofia
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tagged releases must be Authenticode-signed. Manual workflow_dispatch
      # may build unsigned when secrets are not configured (local smoke builds).
      - name: Require Windows signing certificate on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -z "${{ secrets.WINDOWS_CSC_LINK }}" ]; then
            echo "::error::Secret WINDOWS_CSC_LINK is required for tagged Windows releases."
            echo "Add a base64-encoded .pfx (or .p12) as WINDOWS_CSC_LINK and its password as WINDOWS_CSC_KEY_PASSWORD."
            exit 1
          fi
          if [ -z "${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}" ]; then
            echo "::error::Secret WINDOWS_CSC_KEY_PASSWORD is required for tagged Windows releases."
            exit 1
          fi

      - name: Build Windows installer (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WINDOWS_CSC_LINK != '' && 'true' || 'false' }}
        run: npm run build:win

      - name: Build and publish Windows installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: npm run build:win:publish

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-Windows-Installer
          path: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.yml
            dist/**/*.blockmap
          if-no-files-found: error

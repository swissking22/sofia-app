appId: com.sofia.app
productName: SOFIA
copyright: Copyright © 2026 SOFIA
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
# Public hosted Supabase URL + anon/publishable key for packaged main process.
# Lands at process.resourcesPath/cloud-config.json (Windows + macOS).
extraResources:
  - from: resources/cloud-config.json
    to: cloud-config.json
mac:
  category: public.app-category.education
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  minimumSystemVersion: "10.15"
dmg:
  title: "${productName} ${version} - ${arch}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  icon: resources/icon.ico
  # electron-builder 26+: signing options live under signtoolOptions (not win root).
  # Certificate still comes from CI env WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SOFIA
  artifactName: ${productName}-Setup-${version}.${ext}
publish:
  - provider: github
    owner: swissking22
    repo: sofia-app
    releaseType: release

appId: com.sofia.app
productName: SOFIA
copyright: Copyright © 2026 SOFIA
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
mac:
  category: public.app-category.education
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  minimumSystemVersion: "10.15"
dmg:
  title: "${productName} ${version} - ${arch}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SOFIA
publish: null
